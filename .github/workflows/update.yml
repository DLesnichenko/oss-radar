name: Update radar

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Restore the last 90 days of stars for the watchlist before collecting"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: |
          python -m unittest discover -s tests -t .
          node --test tests/logic.test.mjs

      - name: Backfill star history
        if: ${{ inputs.backfill }}
        run: python -m collector.collect --backfill

      # A rate-limit or API failure stops the job here: nothing is committed or published.
      - name: Collect today's snapshot
        run: python -m collector.collect

      - name: Write project purposes (no-op without ANTHROPIC_API_KEY)
        run: python -m collector.purpose

      - name: Build radar.json
        run: python -m collector.build

      - name: Commit data
        run: |
          git config user.name "oss-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update radar data $(date -u +%F)"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/assets
          cp data/radar.json _site/data/radar.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
